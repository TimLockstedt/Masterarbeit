# Default measurement: one image per tile with a green spot on the panel.
setup = "../../config/sp01"
output = "../../results"

[devices.camera]
exposure_ms = 500

[devices.panel]

[devices.lcvr1]
voltage_v = 0
[devices.lcvr2]
voltage_v = 0
[devices.lcvr3]
voltage_v = 0
[devices.lcvr4]
voltage_v = 0

[devices.stage_z]          # recorded; add position_mm = ... to move it at start
# [devices.stage_x]        # not installed yet
# [devices.stage_y]

[measurement]
# center_px = [131, 131]  # default: config/sp01/calibration/panel_camera_center.toml
radius_px = 15
color_rgb = [0, 255, 0]
repeats = 1

# Without [measurement.grid] the image is taken at the current stage position.
# [measurement.grid]
# start_mm = [40, 110]
# count = [3, 2]
# tile_size_mm = 2.0
# overlap_mm = 0.2
# Or draw the region on the overview image (needs [devices.overview_camera],
# stage_x/stage_y and calibration/overview_to_stage.toml):
# [measurement.grid]
# roi = "overview"
# tile_size_mm = 2.0
# overlap_mm = 0.2
# camera = "overview_camera"   # or "webcam"
